# ============================================================
# cooliebase-all-base - 模块化独立部署（BFF + 可选域服务）
# 页面始终由 BFF 提供；设置 COOLIEBASE_DOMAIN_<NAME>_UPSTREAM 后，对应 /api/v1/**/<domain> 由域进程承接。
#
# 一体（单进程，Facade=SDK）：
#   docker compose -f deploy/docker-compose.domains.yml up --build
#   npm run runtime:all
# 拆出 pay（BFF HTTP 反代 + Facade RPC）：
#   docker compose -f deploy/docker-compose.domains.yml --profile pay up --build
#   npm run runtime:split
#   npm run domain:up -- pay
# ============================================================

name: cooliebase-domains
services:
  bff:
    image: ${REGISTRY:-registry.local}/cooliebase-all-base:${TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - DB_DRIVER=${DB_DRIVER:-postgresql}
      - DATABASE_URL=${DATABASE_URL:-postgresql://cooliebase:cooliebase123@postgres:5432/cooliebase_next?schema=public}
      # 生产模式(NODE_ENV=production)会拒绝 <32 字节或默认值的密钥 —— 这是正确的 fail-closed,
      # 但原来的默认值 `dev-team-secret-2026` 属于"默认值", 必然被拒, 于是新栈登录时报
      # 一个令人困惑的 500。用 :? 让配置缺失在**起栈时**就带着说明失败。
      - JWT_SECRET=${JWT_SECRET:?必须显式提供至少 32 字节的强随机密钥（生产模式会拒绝短/默认值）}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-86400}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - COOLIEBASE_DOMAIN_PAY_UPSTREAM=${COOLIEBASE_DOMAIN_PAY_UPSTREAM:-}
      - COOLIEBASE_RPC_TOKEN=${COOLIEBASE_RPC_TOKEN:-}
      - COOLIEBASE_RPC_GATEWAY=${COOLIEBASE_RPC_GATEWAY:-}
      # 平台控制面账号（无租户登录的身份）。必须与初始化 SQL 种下的平台管理员一致,
      # 否则新起的栈**根本登录不了**: isPlatformUsername() 返回 false ->
      # 无 tenantCode 时报"租户账号登录必须填写租户标识"; 带 tenantCode 又按租户查,
      # 而种子用户的 tenant_id 为 NULL -> 查不到。两个方向都堵死。
      - TENANT_MODE=${TENANT_MODE:-disabled}
      - TENANT_PLATFORM_ROLE=${TENANT_PLATFORM_ROLE:-platform-admin}
      - TENANT_PLATFORM_USERNAMES=${TENANT_PLATFORM_USERNAMES:-vps_adm,roma_ops}
    depends_on:
      postgres:
        condition: service_healthy
      pay:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3100/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  pay:
    profiles: ["pay"]
    image: ${REGISTRY:-registry.local}/cooliebase-domain-pay:${TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.domain
      args:
        COOLIEBASE_PACK_DOMAIN: pay
    expose:
      - "3100"
    environment:
      - NODE_ENV=production
      - COOLIEBASE_PACK_DOMAIN=pay
      - DB_DRIVER=${DB_DRIVER:-postgresql}
      - DATABASE_URL=${DATABASE_URL:-postgresql://cooliebase:cooliebase123@postgres:5432/cooliebase_next?schema=public}
      # 生产模式(NODE_ENV=production)会拒绝 <32 字节或默认值的密钥 —— 这是正确的 fail-closed,
      # 但原来的默认值 `dev-team-secret-2026` 属于"默认值", 必然被拒, 于是新栈登录时报
      # 一个令人困惑的 500。用 :? 让配置缺失在**起栈时**就带着说明失败。
      - JWT_SECRET=${JWT_SECRET:?必须显式提供至少 32 字节的强随机密钥（生产模式会拒绝短/默认值）}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-86400}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - COOLIEBASE_RPC_TOKEN=${COOLIEBASE_RPC_TOKEN:-dev-rpc-token}
      - COOLIEBASE_RPC_GATEWAY=${COOLIEBASE_RPC_GATEWAY:-http://bff:3100}
      # 域进程同样要鉴权自己的 /api/v1 路由, 故与 bff 保持一致的平台账号配置。
      - TENANT_MODE=${TENANT_MODE:-disabled}
      - TENANT_PLATFORM_ROLE=${TENANT_PLATFORM_ROLE:-platform-admin}
      - TENANT_PLATFORM_USERNAMES=${TENANT_PLATFORM_USERNAMES:-vps_adm,roma_ops}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3100/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${PG_USER:-cooliebase}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-cooliebase123}
      - POSTGRES_DB=${PG_DB:-cooliebase_next}
    volumes:
      - pg_data_domains:/var/lib/postgresql/data
      # 首次初始化空数据卷时自动执行官方全量初始化 SQL。
      # 此前拆分栈起在**空库**上: 连登录都做不到(域日志实测
      # relation "infra_api_access_log" does not exist), 所以"拆分运行可独立部署"
      # 一直只是纸面结论。用 postgres 官方的 initdb 挂载点, 幂等语义由 Docker 保证
      # (数据卷非空则跳过)。
      - ../sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-cooliebase}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data_domains:
