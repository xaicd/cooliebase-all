# ============================================================
# cooliebase-all - TEST 环境（MySQL + Redis）
# 用途：QA 测试验证，模拟生产配置
# 启动：docker compose -f deploy/docker-compose.test.yml up -d
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - DB_DRIVER=mysql
      - DATABASE_URL=mysql://cooliebase:cooliebase123@mysql:3306/cooliebase_next
      - DB_POOL_SIZE=20
      - JWT_SECRET=${JWT_SECRET:-test-secret-change-me}
      - JWT_EXPIRES_IN=43200
      - REDIS_URL=redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=cooliebase_next
      - MYSQL_USER=cooliebase
      - MYSQL_PASSWORD=cooliebase123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    volumes:
      - mysql_data_test:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cooliebase", "-pcooliebase123"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data_test:
  redis_data_test:
