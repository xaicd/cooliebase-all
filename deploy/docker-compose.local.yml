# ============================================================
# cooliebase-all-base - LOCAL 环境（内存模式，零依赖）
# 用途：快速本地验证，不需要任何外部数据库
# 启动：docker compose -f deploy/docker-compose.local.yml up
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=development
      - DB_DRIVER=memory
      - JWT_SECRET=local-dev-secret-2026
      - JWT_EXPIRES_IN=86400
    restart: unless-stopped
