# Nginx / OpenResty 站点片段（经典政企 / 传统物理机）
# 关键防坑：API 分支未命中要 proxy_intercept_errors + 404 JSON；静态分支才 try_files 落 index.html
location /${slug}/api/ {
    proxy_pass http://127.0.0.1:${PORT}/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_intercept_errors on;
    error_page 404 = @${slug}_api_404;
}
location @${slug}_api_404 {
    default_type application/json;
    return 404 '{"error":"not found","code":"GATEWAY_NO_SUCH_API"}';
}
location /${slug}/ {
    alias ${DIST_DIR}/;
    try_files $uri $uri/ /${slug}/index.html;
}
