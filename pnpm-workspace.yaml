# pnpm workspace 定义（本文件是 workspace 成员的唯一真源，取代 package.json 的 workspaces 字段）。
#
# 成员: 插件包 + 客户端。
# clients/expo 是本仓唯一的独立客户端 App；并进工作区后由根 pnpm 统一解析与安装，
# 它的自带 lock 已删除（pnpm-lock.yaml 是唯一锁文件）。
packages:
  - "packages/plugins/*"
  - "packages/plugins/examples/*"
  - "packages/tools/*"
  - "clients/expo"

# 允许执行构建脚本的原生/工具依赖。
# pnpm 默认拦截依赖的 install/postinstall 脚本（供应链防护），与 npm 11 的行为类似但配置方式不同：
# 未被列出的包其脚本会被跳过 —— 那会导致 better-sqlite3 没有二进制、prisma 没有引擎、
# esbuild 没有可执行文件，进而构建与测试失败。
allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  # embedded-postgres 的 post-install 会生成 Postgres 需要的符号链接；不批准则二进制不可用
  embedded-postgres: true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/linux-x64': true
  # 与 darwin/linux-x64 同族：预编译二进制，批准其构建脚本。
  '@embedded-postgres/linux-arm64': true

# 传递依赖的安全补丁：vitest → vite 被 GHSA-587h-7wmj-h5pm 等 3 条 advisory 命中，
# 修补版为 >=7.3.7（实测安装到 7.3.6）。vitest@latest 就是 5.0.5、无新版可升，
# 故用 override 把 vite 抬到修补版 —— **有补丁就升，不登记为已接受风险**。
overrides:
  # GHSA-834v-8h66-3h79：受影响 <=21.0.3，补丁 >=21.0.4。
  # 上游 @puckeditor/core@0.23.0 仍声明 ^20.0.10 → 这是**显式越界**，必须跑测试验证。
  happy-dom: 21.0.4
  vite: ^7.3.7

# 从 .npmrc 迁来：**pnpm 12 不再读 .npmrc 里的这两项**（实测 `pnpm config get` 返回 undefined，
# 即"写了但没生效"）。这里的键用 camelCase。
# 两者都与 pnpm 的默认值一致（不因 peer 缺失/不匹配直接失败；自动安装 peers），
# 显式写出来是为了让"我们的意图"可见，而不是靠默认值碰巧一致。
strictPeerDependencies: false
autoInstallPeers: true
