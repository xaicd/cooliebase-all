# Generated from packages/shared/backend/constants/domain-catalog.json
# Do not hand-edit pack/upstream fields. Run: npm run domain:manifests
domain: bpm
owner: bpm
kind: plugin
stage: A
contractVersion: v1
implementation: local-ts
publicPrefix:
  - /api/v1/admin/bpm
upstream:
  env: RUOYI_DOMAIN_BPM_UPSTREAM
  protocol: http
  defaultPort: 3213
auth:
  audience: admin
  tenantPolicy: required
resilience:
  timeoutMs: 8000
  retry:
    maxAttempts: 1
    safeMethodsOnly: true
  idempotencyRequired: true
rollout:
  mode: local
messaging:
  transport: in-process
  queueGroup: cooliebase.bpm
  commandSubject: cooliebase.cmd.bpm.>
  eventSubject: cooliebase.evt.bpm.>
invoke:
  colocated: sdk
  remote: rpc
  protocol: nats-rr
  serialization: json
  facade: required
pack:
  enabled: true
  kind: api-only
  independentDatabase: false
  dependsOnModules:
    - shared
    - bpm
