syntax = "proto3";

package cooliebase.bpm.v1;

option go_package = "cooliebase/all-base/gen/bpm/v1;bpmv1";

// Generated from packages/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /cooliebase.bpm.v1.BpmService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListDefinitionsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message ListTasksRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message ActionTaskRequest {
  string task_id = 1 [json_name = "taskId"];
  string action = 2;
  optional string comment = 3;
  optional string delegate_user_id = 4 [json_name = "delegateUserId"];
}

service BpmService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListDefinitions(ListDefinitionsRequest) returns (JsonReply);
  rpc ListTasks(ListTasksRequest) returns (JsonReply);
  rpc ActionTask(ActionTaskRequest) returns (JsonReply);
}
