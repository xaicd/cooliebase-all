syntax = "proto3";

package cooliebase.report.v1;

option go_package = "cooliebase/all-base/gen/report/v1;reportv1";

// Generated from packages/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /cooliebase.report.v1.ReportService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListBoardsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message ExportBoardRequest {
  string board_id = 1 [json_name = "boardId"];
  string format = 2;
  optional string date_from = 3 [json_name = "dateFrom"];
  optional string date_to = 4 [json_name = "dateTo"];
}

service ReportService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListBoards(ListBoardsRequest) returns (JsonReply);
  rpc ExportBoard(ExportBoardRequest) returns (JsonReply);
}
