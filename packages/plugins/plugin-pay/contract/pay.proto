syntax = "proto3";

package cooliebase.pay.v1;

option go_package = "cooliebase/all-base/gen/pay/v1;payv1";

// Generated from packages/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /cooliebase.pay.v1.PayService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListOrdersRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
  optional string status = 4;
}

message CreateOrderRequest {
  string app_id = 1 [json_name = "appId"];
  string channel_code = 2 [json_name = "channelCode"];
  string merchant_order_id = 3 [json_name = "merchantOrderId"];
  string subject = 4;
  int64 amount = 5;
  optional string expire_time = 6 [json_name = "expireTime"];
  optional string notify_url = 7 [json_name = "notifyUrl"];
}

message CreateRefundRequest {
  string pay_order_id = 1 [json_name = "payOrderId"];
  int64 refund_amount = 2 [json_name = "refundAmount"];
  string reason = 3;
}

message ListRefundsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
  optional string status = 4;
}

service PayService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListOrders(ListOrdersRequest) returns (JsonReply);
  rpc CreateOrder(CreateOrderRequest) returns (JsonReply);
  rpc CreateRefund(CreateRefundRequest) returns (JsonReply);
  rpc ListRefunds(ListRefundsRequest) returns (JsonReply);
}
