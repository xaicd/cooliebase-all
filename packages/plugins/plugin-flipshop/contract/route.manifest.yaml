domain: flipshop
module: flipshop
owner: flipshop
kind: business
stage: B
version: v1
contractVersion: v1
implementation: local-ts
publicPrefix:
  - /api/v1/admin/flipshop
upstream:
  env: COOLIEBASE_DOMAIN_FLIPSHOP_UPSTREAM
  protocol: http
  defaultPort: 3227
pack:
  enabled: true
  kind: api-only
  independentDatabase: false
routes:
  - { method: GET, path: /api/v1/admin/flipshop/products, permission: flipshop:product:query, tenantScope: required, timeoutMs: 5000 }
  - { method: POST, path: /api/v1/admin/flipshop/products, permission: flipshop:product:create, tenantScope: required, timeoutMs: 5000 }
  - { method: GET, path: /api/v1/admin/flipshop/products/{id}, permission: flipshop:product:query, tenantScope: required, timeoutMs: 5000 }
