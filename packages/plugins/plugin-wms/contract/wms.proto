syntax = "proto3";

package cooliebase.wms.v1;

option go_package = "cooliebase/all-base/gen/wms/v1;wmsv1";

// Generated from packages/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: pnpm run domain:contracts
// gRPC path: /cooliebase.wms.v1.WmsService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListWarehousesRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message CheckinRequest {
  string warehouse_id = 1 [json_name = "warehouseId"];
  int32 quantity = 2;
  optional string note = 3;
}

message DeductStockRequest {
  optional int32 n = 1;
}

message LockStockRequest {
  optional int32 n = 1;
}

message ReleaseStockRequest {
  optional int32 n = 1;
}

message ReplenishStockRequest {
  optional int32 n = 1;
}

service WmsService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListWarehouses(ListWarehousesRequest) returns (JsonReply);
  rpc Checkin(CheckinRequest) returns (JsonReply);
  rpc DeductStock(DeductStockRequest) returns (JsonReply);
  rpc LockStock(LockStockRequest) returns (JsonReply);
  rpc ReleaseStock(ReleaseStockRequest) returns (JsonReply);
  rpc ReplenishStock(ReplenishStockRequest) returns (JsonReply);
}
