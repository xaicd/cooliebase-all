syntax = "proto3";

package cooliebase.mes.v1;

option go_package = "cooliebase/all-base/gen/mes/v1;mesv1";

// Generated from packages/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: pnpm run domain:contracts
// gRPC path: /cooliebase.mes.v1.MesService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListWorkOrdersRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message ReportWorkRequest {
  string work_order_id = 1 [json_name = "workOrderId"];
  int32 output_qty = 2 [json_name = "outputQty"];
  int32 scrap_qty = 3 [json_name = "scrapQty"];
  optional string note = 4;
}

service MesService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListWorkOrders(ListWorkOrdersRequest) returns (JsonReply);
  rpc ReportWork(ReportWorkRequest) returns (JsonReply);
}
