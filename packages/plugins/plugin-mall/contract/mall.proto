syntax = "proto3";

package cooliebase.mall.v1;

option go_package = "cooliebase/all-base/gen/mall/v1;mallv1";

// Generated from packages/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /cooliebase.mall.v1.MallService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListProductsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message ListOrdersRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message IssueCouponRequest {
  string coupon_template_id = 1 [json_name = "couponTemplateId"];
  string target_user_id = 2 [json_name = "targetUserId"];
  int32 amount = 3;
}

service MallService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListProducts(ListProductsRequest) returns (JsonReply);
  rpc ListOrders(ListOrdersRequest) returns (JsonReply);
  rpc IssueCoupon(IssueCouponRequest) returns (JsonReply);
}
