syntax = "proto3";

package cooliebase.im.v1;

option go_package = "cooliebase/all-base/gen/im/v1;imv1";

// Generated from packages/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /cooliebase.im.v1.ImService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListConversationsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message AuditMessageRequest {
  string conversation_id = 1 [json_name = "conversationId"];
  string message_id = 2 [json_name = "messageId"];
  string decision = 3;
  optional string reason = 4;
}

service ImService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListConversations(ListConversationsRequest) returns (JsonReply);
  rpc AuditMessage(AuditMessageRequest) returns (JsonReply);
}
