syntax = "proto3";

package cooliebase.mp.v1;

option go_package = "cooliebase/all-base/gen/mp/v1;mpv1";

// Generated from packages/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /cooliebase.mp.v1.MpService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListAccountsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message ListFansRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message SendMessageRequest {
  string account_id = 1 [json_name = "accountId"];
  string content = 2;
}

service MpService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListAccounts(ListAccountsRequest) returns (JsonReply);
  rpc ListFans(ListFansRequest) returns (JsonReply);
  rpc SendMessage(SendMessageRequest) returns (JsonReply);
}
