syntax = "proto3";

package cooliebase.crm.v1;

option go_package = "cooliebase/all-base/gen/crm/v1;crmv1";

// Generated from packages/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /cooliebase.crm.v1.CrmService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListCustomersRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message ListCluesRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message CreateFollowupRequest {
  string customer_id = 1 [json_name = "customerId"];
  string content = 2;
}

service CrmService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListCustomers(ListCustomersRequest) returns (JsonReply);
  rpc ListClues(ListCluesRequest) returns (JsonReply);
  rpc CreateFollowup(CreateFollowupRequest) returns (JsonReply);
}
