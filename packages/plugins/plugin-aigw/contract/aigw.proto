syntax = "proto3";

package cooliebase.aigw.v1;

option go_package = "cooliebase/all-base/gen/aigw/v1;aigwv1";

// Generated from packages/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /cooliebase.aigw.v1.AigwService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListChannelsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message CreateChannelRequest {
  string name = 1;
  string provider = 2;
  optional string base_url = 3 [json_name = "baseUrl"];
  optional string api_key = 4 [json_name = "apiKey"];
  json models = 5;
}

message ListTokensRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message CreateTokenRequest {
  string name = 1;
  optional int32 remain_quota = 2 [json_name = "remainQuota"];
}

message ListModelsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message RelayChatRequest {
  string api_key = 1 [json_name = "apiKey"];
  string model = 2;
  json messages = 3;
}

message ListPublicModelsRequest {

}

message EmbedRequest {
  string api_key = 1 [json_name = "apiKey"];
  optional string model = 2;
  json input = 3;
}

service AigwService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListChannels(ListChannelsRequest) returns (JsonReply);
  rpc CreateChannel(CreateChannelRequest) returns (JsonReply);
  rpc ListTokens(ListTokensRequest) returns (JsonReply);
  rpc CreateToken(CreateTokenRequest) returns (JsonReply);
  rpc ListModels(ListModelsRequest) returns (JsonReply);
  rpc RelayChat(RelayChatRequest) returns (JsonReply);
  rpc ListPublicModels(ListPublicModelsRequest) returns (JsonReply);
  rpc Embed(EmbedRequest) returns (JsonReply);
}
