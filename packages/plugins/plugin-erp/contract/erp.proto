syntax = "proto3";

package cooliebase.erp.v1;

option go_package = "cooliebase/all-base/gen/erp/v1;erpv1";

// Generated from packages/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /cooliebase.erp.v1.ErpService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListProductsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message ListOrdersRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message AdjustStockRequest {
  string product_id = 1 [json_name = "productId"];
  int32 delta = 2;
  string reason = 3;
}

service ErpService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListProducts(ListProductsRequest) returns (JsonReply);
  rpc ListOrders(ListOrdersRequest) returns (JsonReply);
  rpc AdjustStock(AdjustStockRequest) returns (JsonReply);
}
