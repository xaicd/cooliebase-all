    readonlySafe: false
  - key: "fms-account.list"
    object: "fms-account"
    verb: "list"
    http: "GET /api/v1/admin/fms/fms-account"
    readonlySafe: true
  - key: "fms-account.get"
    object: "fms-account"
    verb: "get"
    http: "GET /api/v1/admin/fms/fms-account/{id}"
    readonlySafe: true
  - key: "fms-account.create"
    object: "fms-account"
    verb: "create"
    http: "POST /api/v1/admin/fms/fms-account"
    readonlySafe: false
  - key: "pms-project.list"
    object: "pms-project"
