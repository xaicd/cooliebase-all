# Cooliebase All 活体业务本体注册表 (Living Ontology Specification)
# 对标 Layer B Gate G8-1/G8-2/G8-3：实体（Object Types）与动词（Action Types）全部可机检、可回指真实代码与路由。
platform: "cooliebase-all"
version: "1.5.0"
lastUpdated: "2026-11-16"

# M1: 核心领域与第一方插件代表实体 (Object Types — 覆盖平台地基与新增政企套件域)
M1_Objects:
  - key: "system-user"
    name: "系统用户"
    domain: "system"
    source: "packages/domains/system"
  - key: "infra-codegen"
    name: "代码生成配置"
    domain: "infra"
    source: "packages/domains/infra"
  - key: "oa-notice"
    name: "通知公告"
    domain: "oa"
    source: "packages/plugins/plugin-oa"
  - key: "hrm-employee"
    name: "员工档案"
    domain: "hrm"
    source: "packages/plugins/plugin-hrm"
  - key: "fms-account"
    name: "资金账户"
    domain: "fms"
    source: "packages/plugins/plugin-fms"
  - key: "pms-project"
    name: "项目台账"
    domain: "pms"
    source: "packages/plugins/plugin-pms"
  - key: "wms-warehouse"
    name: "仓库主数据"
    domain: "wms"
    source: "packages/plugins/plugin-wms"

# M-Actions: 闭环业务动词（Action Types）—— 全部声明真实 http 路由，由 scripts/ontology-gate.mjs 强校验导出方法
M_ActionTypes:
  - key: "oa-notice.list"
    object: "oa-notice"
    verb: "list"
    http: "GET /api/v1/admin/oa/oa-notice"
    readonlySafe: true
  - key: "oa-notice.get"
    object: "oa-notice"
    verb: "get"
    http: "GET /api/v1/admin/oa/oa-notice/{id}"
    readonlySafe: true
  - key: "oa-notice.create"
    object: "oa-notice"
    verb: "create"
    http: "POST /api/v1/admin/oa/oa-notice"
    readonlySafe: false
  - key: "oa-notice.update"
    object: "oa-notice"
    verb: "update"
    http: "PUT /api/v1/admin/oa/oa-notice/{id}"
    readonlySafe: false
  - key: "oa-notice.delete"
    object: "oa-notice"
    verb: "delete"
    http: "DELETE /api/v1/admin/oa/oa-notice/{id}"
    readonlySafe: false
  - key: "hrm-employee.list"
    object: "hrm-employee"
    verb: "list"
    http: "GET /api/v1/admin/hrm/hrm-employee"
    readonlySafe: true
  - key: "hrm-employee.get"
    object: "hrm-employee"
    verb: "get"
    http: "GET /api/v1/admin/hrm/hrm-employee/{id}"
    readonlySafe: true
  - key: "hrm-employee.create"
