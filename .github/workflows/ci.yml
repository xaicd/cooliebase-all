# CI: 门禁 + 平台可用性冒烟
#
# 为什么最后一节必须有（实测教训）:
#   今天 check / build / fingerprint / task:verify **全绿**，而**登录链是断的** ——
#   因为上面这些门禁测的是**机制**（契约一致、结构守卫、制品指纹），
#   不是**产品能不能用**（能不能建库、种子、登录、调到受保护接口）。
#   `smoke:login` 自管理环境（起库/建库/迁移/种子/登记插件/起服务），跑完清场。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— 版本一致性门禁要读最新 git tag；默认浅克隆没有 tag 会退化为"未校验"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 门禁（契约 / 边界 / 规范 / 结构守卫）
        run: pnpm run check
      # 用 test:clean 而不是手写 `env -u`：后者**漏了 NODE_ENV**，
      # 在 NODE_ENV=production 的环境里会让业务代码走生产分支 → 实测误红。
      # 且 `env -u` 是 POSIX-only；test:clean 是跨平台的。
      - name: 单元与集成测试（干净环境）
        run: pnpm run test:clean
      - name: L3 契约层测试
        run: pnpm run test:contract
      - name: 生产构建
        run: pnpm run build

  # 外部 onboarding：模拟 degit（**无 .git**）→ 安装 → 初始化 → 全量门禁
  #
  # 为什么必须有：README 曾声称这条链路「已实测验证」，而实际跑起来是坏的 ——
  #   ① `project:init` 不 `git init` → 无 `.git` 的派生工程在 `docs:commands:check` 上直接红；
  #   ② 删了归档区却没重生成 wiki → `gen:paths:check` 引用已删路径。
  # 两处都只在"从零开始"的路径上暴露，本仓自己的 `check` 永远看不到。
  #
  # 只在 push 到 main / 手动触发时跑（PR 反馈要保持快）。
  onboarding:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 模拟 degit（取已提交状态，且**没有 .git**）
        run: |
          mkdir -p /tmp/derived
          git archive HEAD | tar -x -C /tmp/derived
          test ! -d /tmp/derived/.git
      - name: 安装依赖
        run: cd /tmp/derived && pnpm install --frozen-lockfile
      - name: 初始化派生工程（应自动建 git 仓库）
        run: |
          cd /tmp/derived
          node scripts/project-init.cjs --in-place --name ci-demo --title "CI Demo"
          test -d .git
          test -n "$(git ls-files)"
      - name: 派生工程必须通过全量门禁
        run: cd /tmp/derived && pnpm run check

  # 孵化端到端：**产物自身能不能跑通它自己的门禁**（G2 的判据）。
  #
  # 为什么必须单列一个 job：基座自己的 `check` 看不到"只在新工程里暴露"的残留 ——
  # 实测（2026-10-20）`project:create` 的产物 `check` exit=1（374 处悬空引用：被裁域的
  # wiki 词条 + llms/README 的规模声明），而**基座 17 个域都在，完全绿**。
  #
  # `project:create` 需要一台真实 Postgres —— 这里走**嵌入式**（零容器），不引入 Docker。
  # 与 onboarding 的分工：onboarding 守"别人从零 clone（无 .git）"；这里守"孵化出的成品能自跑门禁"。
  hatch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 孵化端到端（两条入口 × minimal，各自跑通自身 check）
        run: pnpm run hatch:e2e

  # 平台可用性: 建库 → 迁移 → 种子 → 登记插件 → 起服务 → 登录 → 受保护接口
  smoke:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 登录冒烟（自管理环境）
        run: pnpm run smoke:login
      - name: 失败时输出应用日志
        if: failure()
        run: cat /tmp/smoke-login-app.log 2>/dev/null | tail -60 || true

  # 上线前安全扫描: 对着跑起来的应用打真实请求
  #   §3.2.1 路由保护基线 / §4.8 伪造 tenant / §4.5 不泄露栈 / 安全响应头 / 阴性对照
  # 与 smoke 分开成独立 job: 它更慢，且失败原因完全不同（一个测"能不能用"，一个测"能不能被打"）
  security:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 安全扫描（自管理环境）
        run: pnpm run security:scan
      - name: 失败时输出扫描结果
        if: failure()
        run: cat docs/architecture/artifacts/security-scan-result.json 2>/dev/null || true

  # 容量回归护栏（§3.3 第 6 条: 容量目标须由 SLO、**压测**和资源预算确定）
  load:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 压测（自管理环境，打生产产物）
        run: pnpm run load:test
      - name: 失败时输出压测结果
        if: failure()
        run: cat docs/architecture/artifacts/load-test-result.json 2>/dev/null || true

  # 变异测试: 证明关键断言**有杀伤力**（会临时改写源码再还原，故独立 job）
  mutation:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 变异测试门禁（mutant 必须被杀死）
        run: pnpm run mutation:gate
