# CI: 门禁 + 平台可用性冒烟
#
# 为什么最后一节必须有（实测教训）:
#   今天 check / build / fingerprint / task:verify **全绿**，而**登录链是断的** ——
#   因为上面这些门禁测的是**机制**（契约一致、结构守卫、制品指纹），
#   不是**产品能不能用**（能不能建库、种子、登录、调到受保护接口）。
#   `smoke:login` 自管理环境（起库/建库/迁移/种子/登记插件/起服务），跑完清场。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— 版本一致性门禁要读最新 git tag；默认浅克隆没有 tag 会退化为"未校验"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 门禁（契约 / 边界 / 规范 / 结构守卫）
        run: pnpm run check
      - name: 单元与集成测试（内存模式）
        run: env -u DATABASE_URL -u DB_DRIVER pnpm exec vitest run
      - name: 生产构建
        run: pnpm run build

  # 平台可用性: 建库 → 迁移 → 种子 → 登记插件 → 起服务 → 登录 → 受保护接口
  smoke:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 登录冒烟（自管理环境）
        run: pnpm run smoke:login
      - name: 失败时输出应用日志
        if: failure()
        run: cat /tmp/smoke-login-app.log 2>/dev/null | tail -60 || true

  # 上线前安全扫描: 对着跑起来的应用打真实请求
  #   §3.2.1 路由保护基线 / §4.8 伪造 tenant / §4.5 不泄露栈 / 安全响应头 / 阴性对照
  # 与 smoke 分开成独立 job: 它更慢，且失败原因完全不同（一个测"能不能用"，一个测"能不能被打"）
  security:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 安全扫描（自管理环境）
        run: pnpm run security:scan
      - name: 失败时输出扫描结果
        if: failure()
        run: cat docs/architecture/artifacts/security-scan-result.json 2>/dev/null || true

  # 容量回归护栏（§3.3 第 6 条: 容量目标须由 SLO、**压测**和资源预算确定）
  load:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 压测（自管理环境，打生产产物）
        run: pnpm run load:test
      - name: 失败时输出压测结果
        if: failure()
        run: cat docs/architecture/artifacts/load-test-result.json 2>/dev/null || true
