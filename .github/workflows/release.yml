# Release 流水线: 打 Tag (v*) 触发自动化门禁、离线制品归档与 GitHub / Gitee Releases 发布
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本 Tag (例如 v1.5.0)'
        required: true
        default: 'v1.5.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 运行全量静态质量门禁
        run: pnpm run check

      - name: 运行清洁环境自动化测试套件
        run: pnpm run test:clean

      - name: 构建生产应用
        run: pnpm run build

      - name: 打包离线骨架与发布制品 (Release Artifacts)
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.5.0' }}"
          fi
          pnpm run release:package -- --tag="$TAG"

      - name: 发布至 GitHub Releases (全球开发者分发)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: docs/07_release/releases/${{ github.ref_name }}.md
          files: |
            dist/release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
